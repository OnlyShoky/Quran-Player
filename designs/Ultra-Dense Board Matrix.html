<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corán Player - Ultra-Dense Board Matrix</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030712;
      --card-off: #0f172a;
      --card-hover: #1e293b;
      --card-on: #059669;
      --text: #f8fafc;
      --text-muted: #64748b;
      --accent: #10b981;
      --accent-gold: #f59e0b;
      --gap: 4px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 70px; }

    /* Barra Superior Ultra-Compacta (1 Sola Fila) */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(3, 7, 18, 0.95); backdrop-filter: blur(10px);
      padding: 6px 12px; border-bottom: 1px solid #1e293b;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }

    .brand-group { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .title { font-size: 0.95rem; font-weight: 900; color: #fff; }
    .badge { background: var(--accent); color: #000; font-size: 0.75rem; font-weight: 900; padding: 1px 7px; border-radius: 10px; }

    .reciter-select {
      background: var(--card-off); border: 1px solid #334155; color: var(--accent-gold);
      padding: 6px 10px; border-radius: 6px; font-weight: 700; font-size: 0.8rem; outline: none; cursor: pointer;
    }

    .search-input {
      background: var(--card-off); border: 1px solid #334155; color: #fff;
      padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; outline: none; width: 140px;
    }
    .search-input:focus { border-color: var(--accent); }

    /* GRID ULTRA-DENSO: En desktop muestra 15-20 elementos por fila */
    .dense-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      gap: var(--gap);
      padding: var(--gap);
    }

    /* Celda Compacta de Altura Reducida (55px) */
    .tile {
      background: var(--card-off);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 6px;
      height: 55px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      position: relative;
      transition: background 0.1s, border-color 0.1s;
    }
    .tile:hover { background: var(--card-hover); }
    .tile.active { background: var(--card-on); border-color: var(--accent); }

    .tile-top { display: flex; justify-content: space-between; align-items: center; line-height: 1; }
    .tile-num { font-size: 0.65rem; font-weight: 900; color: var(--text-muted); }
    .tile.active .tile-num { color: #a7f3d0; }

    .tile-check { font-size: 0.65rem; font-weight: 900; opacity: 0; }
    .tile.active .tile-check { opacity: 1; color: #fff; }

    .tile-arabic { font-family: 'Amiri', serif; font-size: 1.05rem; text-align: center; color: var(--text); line-height: 1; margin: 1px 0; }
    .tile-name { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #94a3b8; }
    .tile.active .tile-name { color: #fff; }

    /* Barra de Reproducción Inferior Fina */
    .player-bar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 50px;
      background: #020617; border-top: 2px solid var(--accent);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px; z-index: 200;
    }

    .player-info { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .player-title { font-size: 0.85rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-reciter { font-size: 0.75rem; color: var(--accent-gold); font-weight: 700; white-space: nowrap; }

    .player-controls { display: flex; align-items: center; gap: 6px; }
    .btn-control {
      border: none; border-radius: 6px; font-weight: 900; cursor: pointer;
      display: flex; align-items: center; justify-content: center; height: 36px;
    }
    .btn-clear { background: #334155; color: #fff; padding: 0 10px; font-size: 0.75rem; }
    .btn-play { background: var(--accent); color: #000; width: 44px; font-size: 1.1rem; }
  </style>
</head>
<body>

    <div class="brand-group">
      <span class="title">Corán Board</span>
      <span class="badge" id="selectedBadge">0</span>
    </div>

    <select class="reciter-select" id="reciterSelect" onchange="updateReciter(this.value)">
      <option value="Mishary Rashid Alafasy">Mishary Alafasy</option>
      <option value="Abdul Rahman Al-Sudais">Abdul Rahman Al-Sudais</option>
      <option value="Maher Al-Muaiqly">Maher Al-Muaiqly</option>

      <option value="Abdul Basit">Abdul Basit</option>
      <option value="Minshawi">Minshawi</option>
      <option value="Husary">Husary</option>
    </select>

    <input type="text" class="search-input" id="searchInput" placeholder="Filtrar (ej: 36 o Ya)..." oninput="renderGrid(this.value)">
  </header>

  <main class="dense-grid" id="grid"></main>

  <div class="player-bar">
    <div class="player-info">
      <div class="player-title" id="playerTitle">Selecciona capítulos</div>
      <div class="player-reciter" id="playerReciter">Mishary Rashid Alafasy</div>
    </div>
    <div class="player-controls">
      <button class="btn-control btn-clear" onclick="clearQueue()">VACIAR</button>
      <button class="btn-control btn-play" id="playBtn" onclick="togglePlay()">▶</button>
    </div>
  </div>

    let queue = new Set();
    let isPlaying = false;

    function renderGrid(filter = "") {
      const container = document.getElementById('grid');
      container.innerHTML = "";
      const frag = document.createDocumentFragment();

      const filtered = surahs.filter(s => 
        s.name.toLowerCase().includes(filter.toLowerCase()) || 
        s.id.toString() === filter.trim()
      );

      filtered.forEach(s => {
        const isQueued = queue.has(s.id);
        const tile = document.createElement('div');
        tile.className = `tile ${isQueued ? 'active' : ''}`;
        tile.id = `tile-${s.id}`;
        tile.onclick = () => toggleSurah(s.id, s.name);

        tile.innerHTML = `
          <div class="tile-top">
            <span class="tile-num">#${s.id}</span>
            <span class="tile-check">✓</span>
          </div>
          <div class="tile-arabic">${s.arabic}</div>
          <div class="tile-name">${s.name}</div>
        `;
        frag.appendChild(tile);
      });

      container.appendChild(frag);
    }

    function toggleSurah(id, name) {
      const tile = document.getElementById(`tile-${id}`);
      if (queue.has(id)) {
        queue.delete(id);
      } else {
        queue.add(id);
        document.getElementById('playerTitle').innerText = `${id}. ${name}`;
      }
      if (tile) tile.classList.toggle('active');
      updateUI();
    }

    function updateUI() {
      document.getElementById('selectedBadge').innerText = queue.size;
      if (queue.size === 0) {
        document.getElementById('playerTitle').innerText = 'Selecciona capítulos';
      }
    }

    function updateReciter(name) {
      document.getElementById('playerReciter').innerText = name;
    }

    function clearQueue() {
      queue.clear();
      document.querySelectorAll('.tile.active').forEach(t => t.classList.remove('active'));
      updateUI();
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      document.getElementById('playBtn').innerText = isPlaying ? '❚❚' : '▶';
    }

    renderGrid();
