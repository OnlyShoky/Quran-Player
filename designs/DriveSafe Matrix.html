<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Corán Player - DriveSafe Matrix</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --card-off: #121824;
      --card-on: #059669;
      --border-off: #1e293b;
      --border-on: #34d399;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --accent: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
    body { background-color: var(--bg); color: var(--text-main); padding-bottom: 110px; overflow-x: hidden; }

    /* Barra Superior de Control de Recitador */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(12px);
      padding: 8px;
      border-bottom: 2px solid var(--border-off);
    }

    /* Selector de Recitadores Táctil */
    .reciter-bar {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px;
      scrollbar-width: none;
    }
    .reciter-bar::-webkit-scrollbar { display: none; }

    .reciter-btn {
      background: var(--card-off); border: 2px solid var(--border-off); color: var(--text-muted);
      padding: 12px 16px; border-radius: 8px; font-weight: 800; font-size: 0.9rem;
      white-space: nowrap; cursor: pointer; flex-shrink: 0; transition: 0.1s;
    }
    .reciter-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

    /* Controles de Salto Rápido y Búsqueda */
    .quick-nav { display: grid; grid-template-columns: repeat(4, 1fr) 2fr; gap: 6px; margin-top: 4px; }
    .nav-btn {
      background: #1e293b; border: none; color: #fff; font-weight: 900; font-size: 0.85rem;
      padding: 12px 0; border-radius: 6px; cursor: pointer; text-align: center;
    }
    .nav-btn.active { background: #334155; color: var(--accent); }

    .search-input {
      background: #0f172a; border: 2px solid var(--border-off); color: #fff;
      padding: 0 12px; border-radius: 6px; font-weight: 800; font-size: 0.9rem; width: 100%; outline: none;
    }

    /* Matriz de Bloques Gigantes */
    .matrix-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding: 8px;
    }

    @media (min-width: 600px) { .matrix-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 900px) { .matrix-grid { grid-template-columns: repeat(4, 1fr); } }

    /* SOLUCIÓN AL BUG: Ajuste de flexbox, min-height y eliminación de nowrap */
    .surah-box {
      background: var(--card-off);
      border: 2px solid var(--border-off);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px; /* Mantiene los textos separados sin aplastarse */
      min-height: 110px; /* En lugar de altura fija para que el texto fluya */
      cursor: pointer;
      position: relative;
    }

    .surah-box.active {
      background: var(--card-on);
      border-color: var(--border-on);
    }

    .box-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .box-num { font-size: 1.2rem; font-weight: 900; color: var(--text-muted); }
    .surah-box.active .box-num { color: #022c22; }
    .box-status { font-size: 1.4rem; font-weight: 900; line-height: 1; }

    /* Texto principal ahora hace salto de línea si es largo y no se esconde */
    .box-title { font-size: 1.15rem; font-weight: 800; color: #ffffff; line-height: 1.1; }
    .box-translate { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; margin-top: -2px; }
    .surah-box.active .box-translate { color: #a7f3d0; }
    
    .box-bottom { display: flex; justify-content: space-between; align-items: flex-end; margin-top: auto; }
    .box-arabic { font-family: 'Amiri', serif; font-size: 1.35rem; color: var(--accent); line-height: 1; }
    .surah-box.active .box-arabic { color: #ffffff; }

    /* Reproductor Fijo Gigante Inferior */
    .player-dock {
      position: fixed; bottom: 0; left: 0; right: 0; height: 100px;
      background: #030712; border-top: 4px solid var(--accent);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; z-index: 200;
    }

    .dock-info { display: flex; flex-direction: column; gap: 4px; max-width: 50%; }
    .dock-title { font-size: 1.1rem; font-weight: 900; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dock-reciter { font-size: 0.9rem; font-weight: 800; color: var(--accent); }
    .dock-count { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; background: #1e293b; padding: 2px 8px; border-radius: 4px; display: inline-block; width: max-content; }

    .dock-controls { display: flex; align-items: center; gap: 10px; }
    .btn-dock {
      background: var(--accent); color: #000; border: none;
      width: 70px; height: 70px; border-radius: 16px; font-size: 2rem; font-weight: 900;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .btn-clear {
      background: #334155; color: #f8fafc; border: none;
      padding: 0 16px; height: 70px; border-radius: 16px; font-size: 0.9rem; font-weight: 900; cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="reciter-bar">
      <button class="reciter-btn active" onclick="setReciter(this, 'Mishary Alafasy')">🎙 Alafasy</button>
      <button class="reciter-btn" onclick="setReciter(this, 'Abdul Sudais')">🎙 Sudais</button>
      <button class="reciter-btn" onclick="setReciter(this, 'Maher Al-Muaiqly')">🎙 Muaiqly</button>
      <button class="reciter-btn" onclick="setReciter(this, 'Yasser Al-Dosari')">🎙 Dosari</button>
    </div>

    <div class="quick-nav">
      <button class="nav-btn active" onclick="filterRange(1, 114, this)">ALL</button>
      <button class="nav-btn" onclick="filterRange(1, 30, this)">1-30</button>
      <button class="nav-btn" onclick="filterRange(31, 60, this)">31-60</button>
      <button class="nav-btn" onclick="filterRange(61, 114, this)">61-114</button>
      <input type="text" class="search-input" id="searchInput" placeholder="🔍 Buscar" oninput="handleSearch(this.value)">
    </div>
  </header>

  <main class="matrix-grid" id="matrixGrid"></main>

  <div class="player-dock">
    <div class="dock-info">
      <div class="dock-title" id="dockTitle">1. Al-Fátiha</div>
      <div class="dock-reciter" id="dockReciter">Mishary Alafasy</div>
      <div class="dock-count" id="dockCount">Lista: 4</div>
    </div>
    <div class="dock-controls">
      <button class="btn-clear" onclick="clearQueue()">VACIAR</button>
      <button class="btn-dock" id="playBtn" onclick="togglePlay()">▶</button>
    </div>
  </div>

      { id: 113, name: "Al-Falaq", trans: "El Alba", arabic: "الفلق" },
      { id: 114, name: "An-Nas", trans: "La Humanidad", arabic: "الناس" }
    ];

    const queue = new Set([1, 36, 67, 112]);
    let currentMin = 1, currentMax = 114;
    let isPlaying = false;

    function renderGrid(query = "") {
      const container = document.getElementById('matrixGrid');
      container.innerHTML = "";

      const filtered = surahs.filter(s => {
        const inRange = s.id >= currentMin && s.id <= currentMax;
        const matchesQuery = s.name.toLowerCase().includes(query.toLowerCase()) || 
                             s.trans.toLowerCase().includes(query.toLowerCase()) ||
                             s.id.toString() === query.trim();
        return inRange && matchesQuery;
      });

      filtered.forEach(s => {
        const inQueue = queue.has(s.id);
        const box = document.createElement('div');
        box.className = `surah-box ${inQueue ? 'active' : ''}`;
        box.onclick = () => toggleSurah(s.id, s.name);

        box.innerHTML = `
          <div class="box-header">
            <span class="box-num">#${s.id}</span>
            <span class="box-status">${inQueue ? '✓' : '+'}</span>
          </div>
          <div>
            <div class="box-title">${s.name}</div>
            <div class="box-translate">${s.trans}</div>
          </div>
          <div class="box-bottom">
             <div></div> <!-- Espaciador -->
             <div class="box-arabic">${s.arabic}</div>
          </div>
        `;

        container.appendChild(box);
      });

      document.getElementById('dockCount').innerText = `Lista: ${queue.size}`;
    }

    function toggleSurah(id, name) {
      if (queue.has(id)) {
        queue.delete(id);
      } else {
        queue.add(id);
        document.getElementById('dockTitle').innerText = `${id}. ${name}`;
      }
      renderGrid(document.getElementById('searchInput').value);
    }

    function setReciter(btn, reciterName) {
      document.querySelectorAll('.reciter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('dockReciter').innerText = reciterName;
    }

    function filterRange(min, max, btn) {
      currentMin = min; currentMax = max;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('searchInput').value = "";
      renderGrid();
    }

    function handleSearch(val) {
      renderGrid(val);
    }

    function clearQueue() {
      queue.clear();
      renderGrid();
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      document.getElementById('playBtn').innerText = isPlaying ? '❚❚' : '▶';
    }

    renderGrid();
  </script>
</body>
</html>
