<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corán Player - Fluid Pill Matrix HUD</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #050811;
      --surface: #0f172a;
      --surface-hover: #1e293b;
      --accent: #10b981;
      --accent-active: #059669;
      --accent-gold: #f59e0b;
      --text: #f8fafc;
      --text-muted: #64748b;
      --border: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
    body { background-color: var(--bg-dark); color: var(--text); padding-bottom: 75px; overflow-x: hidden; }

    /* Barra Superior Compacta */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(5, 8, 17, 0.95); backdrop-filter: blur(12px);
      padding: 8px 12px; border-bottom: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 8px;
    }

    .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .brand { font-size: 0.95rem; font-weight: 900; display: flex; align-items: center; gap: 8px; }
    .badge { background: var(--accent); color: #000; font-size: 0.75rem; font-weight: 900; padding: 2px 8px; border-radius: 20px; }

    .reciter-select {
      background: var(--surface); border: 1px solid var(--border); color: var(--accent-gold);
      padding: 6px 10px; border-radius: 8px; font-weight: 700; font-size: 0.8rem; outline: none; cursor: pointer;
    }

    .search-input {
      background: var(--surface); border: 1px solid var(--border); color: #fff;
      padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; outline: none; min-width: 150px;
    }
    .search-input:focus { border-color: var(--accent); }

    /* Presets de Un Clic */
    .presets-bar { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    .presets-bar::-webkit-scrollbar { display: none; }
    .btn-preset {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-muted);
      padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; white-space: nowrap; cursor: pointer;
    }
    .btn-preset:hover { background: var(--surface-hover); color: #fff; }

    /* MATRIZ DE ETIQUETAS (PILLS) ULTRA-ADAPTABLE */
    .pill-matrix {
      display: grid;
      /* En pantallas de PC ancha muestra 12-16 por fila; en móviles se ajusta limpio */
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 5px;
      padding: 8px;
    }

    .pill {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      height: 42px;
      transition: background 0.1s, border-color 0.1s;
    }
    .pill:hover { background: var(--surface-hover); }
    .pill.selected {
      background: var(--accent-active);
      border-color: var(--accent);
    }

    .pill-left { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .pill-num { font-size: 0.7rem; font-weight: 900; color: var(--text-muted); flex-shrink: 0; }
    .pill.selected .pill-num { color: #a7f3d0; }

    .pill-name { font-size: 0.75rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pill.selected .pill-name { color: #fff; }

    .pill-arabic { font-family: 'Amiri', serif; font-size: 0.95rem; color: var(--accent); flex-shrink: 0; }
    .pill.selected .pill-arabic { color: #fff; }

    /* Reproductor Inferior Fijo */
    .player-hud {
      position: fixed; bottom: 0; left: 0; right: 0; height: 55px;
      background: #020617; border-top: 2px solid var(--accent);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; z-index: 200;
    }

    .hud-info { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .hud-title { font-size: 0.85rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hud-reciter { font-size: 0.75rem; color: var(--accent-gold); font-weight: 700; white-space: nowrap; }

    .hud-controls { display: flex; align-items: center; gap: 8px; }
    .btn-hud {
      border: none; border-radius: 8px; font-weight: 900; cursor: pointer;
      display: flex; align-items: center; justify-content: center; height: 38px;
    }
    .btn-clear { background: #334155; color: #fff; padding: 0 12px; font-size: 0.75rem; }
    .btn-play { background: var(--accent); color: #000; width: 48px; font-size: 1.2rem; }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <div class="brand">
        <span>📖 Corán HUD</span>
        <span class="badge" id="selectedBadge">0</span>
      </div>

      <select class="reciter-select" id="reciterSelect" onchange="updateReciter(this.value)">
        <option value="Mishary Rashid Alafasy">Mishary Rashid Alafasy</option>
        <option value="Abdul Rahman Al-Sudais">Abdul Rahman Al-Sudais</option>
        <option value="Maher Al-Muaiqly">Maher Al-Muaiqly</option>
        <option value="Yasser Al-Dosari">Yasser Al-Dosari</option>
        <option value="Saad Al-Ghamdi">Saad Al-Ghamdi</option>
        <option value="Abdul Basit Abdul Samad">Abdul Basit</option>
        <option value="Siddiq Al-Minshawi">Siddiq Al-Minshawi</option>
      </select>

      <input type="text" class="search-input" id="searchInput" placeholder="Filtrar (ej: 36 o Ya)..." oninput="renderMatrix(this.value)">
    </div>

    <!-- Filtros/Presets Rápidos -->
    <div class="presets-bar">
      <button class="btn-preset" onclick="selectPreset('daily')">⭐ Diarias (1, 36, 67, 112)</button>
      <button class="btn-preset" onclick="selectPreset('juz30')">📜 Juz 'Amma (78-114)</button>
      <button class="btn-preset" onclick="selectPreset('short')">⚡ Cortas (100-114)</button>
      <button class="btn-preset" onclick="clearQueue()">✕ Vaciar Selección</button>
    </div>
  </header>

  <main class="pill-matrix" id="pillMatrix"></main>

  <div class="player-hud">
    <div class="hud-info">
      <div class="hud-title" id="hudTitle">Selecciona capítulos</div>
      <div class="hud-reciter" id="hudReciter">Mishary Rashid Alafasy</div>
    </div>
    <div class="hud-controls">
      <button class="btn-hud btn-clear" onclick="clearQueue()">VACIAR</button>
      <button class="btn-hud btn-play" id="playBtn" onclick="togglePlay()">▶</button>
    </div>
  </div>

      { id: 113, name: "Al-Falaq", arabic: "الفلق" },
      { id: 114, name: "An-Nas", arabic: "الناس" }
    ];

    let queue = new Set();
    let isPlaying = false;

    function renderMatrix(filter = "") {
      const container = document.getElementById('pillMatrix');
      container.innerHTML = "";
      const frag = document.createDocumentFragment();

      const filtered = surahs.filter(s => 
        s.name.toLowerCase().includes(filter.toLowerCase()) || 
        s.id.toString() === filter.trim()
      );

      filtered.forEach(s => {
        const isSelected = queue.has(s.id);
        const pill = document.createElement('div');
        pill.className = `pill ${isSelected ? 'selected' : ''}`;
        pill.id = `pill-${s.id}`;
        pill.onclick = () => toggleSurah(s.id, s.name);

        pill.innerHTML = `
          <div class="pill-left">
            <span class="pill-num">#${s.id}</span>
            <span class="pill-name">${s.name}</span>
          </div>
          <span class="pill-arabic">${s.arabic}</span>
        `;
        frag.appendChild(pill);
      });

      container.appendChild(frag);
    }

    function toggleSurah(id, name) {
      const pill = document.getElementById(`pill-${id}`);
      if (queue.has(id)) {
        queue.delete(id);
      } else {
        queue.add(id);
        document.getElementById('hudTitle').innerText = `${id}. ${name}`;
      }
      if (pill) pill.classList.toggle('selected');
      updateUI();
    }

    function selectPreset(type) {
      queue.clear();
      if (type === 'daily') [1, 36, 67, 112].forEach(id => queue.add(id));
      if (type === 'juz30') { for (let i = 78; i <= 114; i++) queue.add(i); }
      if (type === 'short') { for (let i = 100; i <= 114; i++) queue.add(i); }
      
      renderMatrix();
      updateUI();
    }

    function updateUI() {
      document.getElementById('selectedBadge').innerText = queue.size;
      if (queue.size === 0) {
        document.getElementById('hudTitle').innerText = 'Selecciona capítulos';
      }
    }

    function updateReciter(name) {
      document.getElementById('hudReciter').innerText = name;
    }

    function clearQueue() {
      queue.clear();
      document.querySelectorAll('.pill.selected').forEach(p => p.classList.remove('selected'));
      updateUI();
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      document.getElementById('playBtn').innerText = isPlaying ? '❚❚' : '▶';
    }

    renderMatrix();

</html>
