<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Corán Player - Fluid Mosaic v2</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030712;
      --tile-off: #111827;
      --tile-off-hover: #1f2937;
      --tile-on: #059669;       /* Verde vibrante para activo */
      --tile-on-glow: #10b981;
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --text-on: #ffffff;
      --gap: 8px;              /* Separación global */
    }

    * { 
      box-sizing: border-box; margin: 0; padding: 0; 
      font-family: 'Inter', sans-serif; 
      -webkit-tap-highlight-color: transparent; 
      user-select: none;
    }
    
    body { 
      background-color: var(--bg); 
      color: var(--text-main); 
      padding-bottom: 120px; 
      padding-top: max(env(safe-area-inset-top), 10px); /* Para el notch del iPhone */
    }

    /* HEADER DINÁMICO */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(3, 7, 18, 0.9); backdrop-filter: blur(12px);
      padding: 15px calc(var(--gap) * 2);
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .status-group { display: flex; flex-direction: column; }
    .status-title { font-size: 1.1rem; font-weight: 900; letter-spacing: -0.5px; }
    .status-sub { font-size: 0.75rem; font-weight: 700; color: var(--tile-on-glow); }
    
    .reciter-btn { 
      background: var(--tile-off); color: var(--text-main); 
      border: 1px solid rgba(255,255,255,0.1);
      padding: 8px 16px; border-radius: 30px; 
      font-weight: 800; font-size: 0.8rem; cursor: pointer;
    }

    /* MOSAICO FLUIDO (EL CORAZÓN DE LA MEJORA) */
    .fluid-grid {
      display: grid;
      /* Grid fluido perfecto: mínimo 80px, máximo lo que de la pantalla repartido por igual */
      grid-template-columns: repeat(auto-fill, minmax(max(80px, calc((100vw - (var(--gap) * 6)) / 5)), 1fr));
      gap: var(--gap);
      padding: var(--gap);
    }

    /* En pantallas muy estrechas, forzamos 4 columnas */
    @media (max-width: 400px) {
      .fluid-grid { grid-template-columns: repeat(4, 1fr); }
    }
    /* En modo horizontal o tablets, forzamos de 6 a 8 columnas */
    @media (min-width: 600px) {
      .fluid-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
    }

    .tile {
      background: var(--tile-off);
      border-radius: 14px;
      aspect-ratio: 1 / 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative; cursor: pointer;
      container-type: inline-size; /* Contenedor para tamaño tipográfico fluido */
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.02);
    }

    /* Efecto Botón Físico */
    .tile:active { transform: scale(0.92); }
    
    .tile.active {
      background: linear-gradient(135deg, var(--tile-on), #047857);
      border-color: var(--tile-on-glow);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.2), inset 0 2px 4px rgba(255,255,255,0.2);
    }

    /* Elementos internos usando CQW (Container Query Width) para no desbordar JAMÁS */
    .tile-num {
      position: absolute; top: 6%; left: 8%;
      font-size: clamp(0.6rem, 15cqw, 0.9rem);
      font-weight: 900; color: var(--text-muted);
    }
    .tile.active .tile-num { color: #a7f3d0; }

    .tile-arabic {
      font-family: 'Amiri', serif;
      /* Tipografía fluida relativa a su cuadrado */
      font-size: clamp(1.5rem, 40cqw, 2.5rem);
      line-height: 1.1; margin-top: 5%;
      color: var(--text-main);
    }

    .tile-name {
      font-size: clamp(0.55rem, 12cqw, 0.8rem);
      font-weight: 800; text-transform: uppercase; text-align: center;
      width: 90%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: #94a3b8; margin-top: 2%;
    }
    .tile.active .tile-name, .tile.active .tile-arabic { color: var(--text-on); font-weight: 900; }

    /* Indicador Visual Integrado */
    .indicator {
      position: absolute; top: 6%; right: 8%;
      width: 8px; height: 8px; border-radius: 50%;
      background: transparent;
      transition: background 0.2s;
    }
    .tile.active .indicator { background: #ffffff; box-shadow: 0 0 5px #fff; }

    /* REPRODUCTOR FLOTANTE INFERIOR (Ocultable) */
    .player-dock {
      position: fixed; bottom: var(--gap); left: var(--gap); right: var(--gap);
      background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px);
      padding: 12px 16px; border-radius: 20px;
      display: flex; align-items: center; justify-content: space-between;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      
      transform: translateY(150%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1000;
    }
    
    /* Soporte Safe Area iPhone */
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .player-dock { bottom: max(var(--gap), env(safe-area-inset-bottom)); }
    }

    .player-dock.visible { transform: translateY(0); }

    .player-info { display: flex; flex-direction: column; max-width: 65%; }
    .now-playing { font-size: 1rem; font-weight: 900; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .queue-info { font-size: 0.75rem; color: var(--tile-on-glow); font-weight: 700; margin-top: 2px;}

    .player-controls { display: flex; gap: 8px; }
    .btn-dock {
      border: none; border-radius: 14px; font-weight: 900;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .btn-x { background: rgba(255,255,255,0.1); color: #fff; width: 45px; height: 45px; font-size: 1rem; }
    .btn-x:active { background: #ef4444; }
    
    .btn-play { background: var(--tile-on-glow); color: #000; width: 60px; height: 45px; font-size: 1.5rem; }
    .btn-play:active { transform: scale(0.95); }

  </style>
</head>
<body>

    </div>

    let queue = new Set();
    let isPlaying = false;
    let lastAdded = null;

    function renderGrid() {
      const container = document.getElementById('grid');
      container.innerHTML = "";
      
      const fragment = document.createDocumentFragment();

      surahs.forEach(s => {
        const isQueued = queue.has(s.id);
        const tile = document.createElement('div');
        tile.className = `tile ${isQueued ? 'active' : ''}`;
        tile.id = `tile-${s.id}`;
        
        // Al tocar cualquier parte del cuadrado, se dispara la acción
        tile.onclick = () => toggleSurah(s.id, s.name);

        tile.innerHTML = `
          <span class="tile-num">${s.id}</span>
          <div class="indicator"></div>
          <span class="tile-arabic">${s.arabic}</span>
          <span class="tile-name">${s.name}</span>
        `;
        fragment.appendChild(tile);
      });
      
      container.appendChild(fragment);
      updateUI();
    }

    function toggleSurah(id, name) {
      const tile = document.getElementById(`tile-${id}`);
      
      if (queue.has(id)) {
        queue.delete(id);
        if(queue.size === 0) lastAdded = null;
      } else {
        queue.add(id);
        lastAdded = { id, name };
        
        // Pequeña animación de rebote extra al añadir
        tile.style.transform = "scale(0.85)";
        setTimeout(() => tile.style.transform = "", 150);
      }
      
      tile.classList.toggle('active');
      updateUI();
    }

    function updateUI() {
      const dock = document.getElementById('playerDock');
      const count = queue.size;
      
      if (count > 0) {
        dock.classList.add('visible');
        document.getElementById('headerCount').innerText = `${count} seleccionados`;
        
        if (lastAdded) {
          document.getElementById('nowPlayingText').innerText = `${lastAdded.id}. ${lastAdded.name}`;
        }
        document.getElementById('queueInfoText').innerText = `Lista activa: ${count}`;
      } else {
        dock.classList.remove('visible');
        document.getElementById('headerCount').innerText = 'Selecciona capítulos';
        isPlaying = false;
        document.getElementById('playBtn').innerText = '▶';
      }
    }

    function clearAll() {
      queue.clear();
      lastAdded = null;
      
      // Quitar la clase active de todos los tiles sin re-renderizar todo el DOM
      document.querySelectorAll('.tile.active').forEach(tile => {
        tile.classList.remove('active');
      });
      
      updateUI();
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      document.getElementById('playBtn').innerText = isPlaying ? '❚❚' : '▶';
    }

    // Inicializar la grid
    renderGrid();
  </script>
