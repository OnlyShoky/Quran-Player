name: quran_player
description: "A minimalist Quran chapter audio player."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.0.0
  google_fonts: ^6.2.1
  font_awesome_flutter: ^11.0.0
  shared_preferences: ^2.3.0
  http: ^1.6.0
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.1.21
  url_launcher: ^6.3.1
  firebase_core: ^4.1.0
  firebase_analytics: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sukun_logo.png
    - assets/data/favicon.png
